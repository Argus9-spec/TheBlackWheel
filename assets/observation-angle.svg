<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 300"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Observation angle range</title>

    <desc id="description">
        Two matching diagrams show a device lying flat on a table,
        observed through rectangular viewing tubes at exactly
        forty-five degrees and seventy-five degrees. The bottom
        edge of each device is identified on the right.
    </desc>

    <defs>
        <style>
            .line {
                fill: none;
                stroke: #ffffff;
                stroke-width: 2.4;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .dashed {
                stroke-dasharray: 8 8;
            }

            .label {
                fill: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 20px;
            }

            .star-label {
                fill: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
            }

            .edge-label {
                fill: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 15px;
                letter-spacing: 0.06em;
            }
        </style>

        <!-- Arrowhead used by both exact angle arcs -->
        <marker
            id="angle-arrow"
            markerWidth="7"
            markerHeight="7"
            refX="5.4"
            refY="3.5"
            orient="auto"
            markerUnits="strokeWidth"
        >
            <path
                d="M0 0 L7 3.5 L0 7 Z"
                fill="#ffffff"
            />
        </marker>

        <!--
            Canonical observation eye.

            The oval iris touches the outer curved line at its
            lowest point. There is no additional interior line.
        -->
        <g id="observation-eye">
            <path
                class="line"
                d="
                    M -30 -18
                    L 20 -18
                    L 24 18
                    Q 0 32 -24 18
                    Z
                "
            />

            <ellipse
                class="line"
                cx="-3"
                cy="26"
                rx="11"
                ry="6"
            />
        </g>
    </defs>

    <!-- Black background -->
    <rect
        width="800"
        height="300"
        fill="#000000"
    />

    <!-- Center divider -->
    <line
        class="line"
        x1="400"
        y1="28"
        x2="400"
        y2="272"
        opacity="0.7"
    />

    <!-- ===================================================== -->
    <!-- EXACT 45-DEGREE DIAGRAM                               -->
    <!-- ===================================================== -->

    <g transform="translate(20 10)">

        <!-- Table -->
        <line
            class="line"
            x1="20"
            y1="245"
            x2="350"
            y2="245"
        />

        <!-- Device -->
        <rect
            class="line"
            x="45"
            y="210"
            width="230"
            height="35"
            rx="5"
        />

        <!-- Bottom-edge vertical reference -->
        <line
            class="line dashed"
            x1="275"
            y1="210"
            x2="275"
            y2="145"
        />

        <!-- Bottom-edge pointer -->
        <line
            class="line"
            x1="275"
            y1="225"
            x2="300"
            y2="207"
        />

        <text
            class="edge-label"
            x="306"
            y="211"
        >
            BOTTOM
        </text>

        <!--
            Exact 45° sightline.

            Origin:
            x = 115
            y = 210

            Direction:
            cos(45°) = 0.70710678
            sin(45°) = 0.70710678
        -->

        <!-- Sightline below tube -->
        <line
            class="line dashed"
            x1="115"
            y1="210"
            x2="174.397"
            y2="150.603"
        />

        <!--
            Rectangular viewing tube.

            Starts 92 units along the exact 45° sightline.
            Length = 44.
            No curved ends.
        -->
        <g
            transform="
                translate(180.054 144.946)
                rotate(-45)
            "
        >
            <rect
                class="line"
                x="0"
                y="-7"
                width="44"
                height="14"
            />
        </g>

        <!-- Short sightline between tube and eye -->
        <line
            class="line dashed"
            x1="214.702"
            y1="110.298"
            x2="216.823"
            y2="108.177"
        />

        <!--
            Canonical eye.

            The eye is rotated so its observational axis aligns
            precisely with the 45° sightline.

            Both diagram eyes share the same vertical center.
        -->
        <g
            transform="
                translate(235.915 89.085)
                rotate(45)
            "
        >
            <use href="#observation-eye" />
        </g>

        <!-- Exact 45° angle arc -->
        <path
            class="line"
            marker-end="url(#angle-arrow)"
            d="
                M 167 210
                A 52 52 0 0 0
                151.770 173.230
            "
        />

        <!-- Degree label -->
        <text
            class="label"
            x="174"
            y="184"
        >
            45°
        </text>

        <!-- Small significance star -->
        <text
            class="star-label"
            x="211"
            y="172"
        >
            ★
        </text>
    </g>

    <!-- ===================================================== -->
    <!-- EXACT 75-DEGREE DIAGRAM                               -->
    <!-- ===================================================== -->

    <g transform="translate(410 10)">

        <!-- Table -->
        <line
            class="line"
            x1="20"
            y1="245"
            x2="350"
            y2="245"
        />

        <!-- Device -->
        <rect
            class="line"
            x="45"
            y="210"
            width="230"
            height="35"
            rx="5"
        />

        <!-- Bottom-edge vertical reference -->
        <line
            class="line dashed"
            x1="275"
            y1="210"
            x2="275"
            y2="145"
        />

        <!-- Bottom-edge pointer -->
        <line
            class="line"
            x1="275"
            y1="225"
            x2="300"
            y2="207"
        />

        <text
            class="edge-label"
            x="306"
            y="211"
        >
            BOTTOM
        </text>

        <!--
            Exact 75° sightline.

            Origin:
            x = 115
            y = 210

            Direction:
            cos(75°) = 0.25881905
            sin(75°) = 0.96592583
        -->

        <!-- Sightline below tube -->
        <line
            class="line dashed"
            x1="115"
            y1="210"
            x2="126.388"
            y2="167.499"
        />

        <!--
            Rectangular viewing tube.

            Starts 48 units along the exact 75° sightline.
            Length = 44.
            No curved ends.
        -->
        <g
            transform="
                translate(127.423 163.636)
                rotate(-75)
            "
        >
            <rect
                class="line"
                x="0"
                y="-7"
                width="44"
                height="14"
            />
        </g>

        <!-- Short sightline between tube and eye -->
        <line
            class="line dashed"
            x1="138.811"
            y1="121.135"
            x2="140.414"
            y2="115.153"
        />

        <!--
            Canonical eye.

            Its center is at the same vertical height as the
            45° eye. Its rotation aligns its observational axis
            precisely with the 75° sightline.
        -->
        <g
            transform="
                translate(147.400 89.085)
                rotate(15)
            "
        >
            <use href="#observation-eye" />
        </g>

        <!-- Exact 75° angle arc -->
        <path
            class="line"
            marker-end="url(#angle-arrow)"
            d="
                M 167 210
                A 52 52 0 0 0
                128.459 159.772
            "
        />

        <!-- Degree label -->
        <text
            class="label"
            x="174"
            y="184"
        >
            75°
        </text>
    </g>
</svg>