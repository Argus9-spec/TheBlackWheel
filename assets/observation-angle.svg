<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 300"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Observation angle range</title>

    <desc id="description">
        Two matching diagrams show a device lying flat on a table,
        observed through viewing tubes at forty-five degrees and
        seventy-five degrees. Both observers are shown at the same
        height, and the bottom edge of each device is identified.
    </desc>

    <style>
        .line {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .dashed {
            stroke-dasharray: 8 8;
        }

        .label {
            fill: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 27px;
        }

        .star-label {
            fill: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .edge-label {
            fill: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            letter-spacing: 0.06em;
        }
    </style>
<defs>
    <!-- Canonical Observation Eye -->
    <g id="observation-eye">

        <!--
            Symmetrical angular frame.
            Both lower ends extend beyond the eyelid,
            creating the small eyelash overhang.
        -->
        <path
    class="line"
    d="
        M -34.5 13
        L 0 -30
        L 34.5 13
    "
/>

        <!--
            Wide-open curved eyelid.
            It joins inside the frame ends,
            leaving an equal overhang on both sides.
        -->
        <path
            class="line"
            d="
                M -29 7
                Q 0 51
                29 7
            "
        />

        <!-- Outer iris seated on the eyelid -->
        <ellipse
            class="line"
            cx="0"
            cy="20"
            rx="14"
            ry="8"
        />

        <!-- Inner pupil seated inside the iris -->
        <ellipse
            class="line"
            cx="0"
            cy="23"
            rx="7"
            ry="5"
        />

    </g>
</defs>

    <!-- Black background -->
    <rect
        width="800"
        height="300"
        fill="#000000"
    />

    <!-- ===================================================== -->
    <!-- 45-DEGREE DIAGRAM — LEFT                              -->
    <!-- ===================================================== -->

    <g transform="translate(20 10)">

        <!-- Table -->
        <line
            class="line"
            x1="20"
            y1="245"
            x2="350"
            y2="245"
        />

        <!-- Device -->
        <rect
            class="line"
            x="45"
            y="222"
            width="230"
            height="23"
            rx="5"
        />

        <!-- Device controls -->
        <rect
            class="line"
            x="72"
            y="230.5"
            width="14"
            height="6"
        />

        <rect
            class="line"
            x="94"
            y="230.5"
            width="14"
            height="6"
        />

        <!-- Bottom-edge reference -->
        <line
            class="line dashed"
            x1="275"
            y1="222"
            x2="275"
            y2="145"
        />

        <line
            class="line"
            x1="275"
            y1="234"
            x2="300"
            y2="216"
        />

        <text
            class="edge-label"
            x="306"
            y="220"
        >
            BOTTOM
        </text>

        <!--
            Exact 45-degree sightline.

            Origin: 115, 222
            Tube begins: 214.33, 122.67
        -->
        <line
            class="line dashed"
            x1="115"
            y1="222"
            x2="214.33"
            y2="122.67"
        />

        <!-- Viewing tube aligned exactly to 45 degrees -->
        <g transform="translate(214.33 122.67) rotate(-45)">
            <rect
                class="line"
                x="0"
                y="-9"
                width="52"
                height="18"
            />
        </g>

        <!--
            Eye center: 261, 76
            Same vertical height as the 75-degree eye.
            Small gap remains between tube and eye.
        -->
        <g transform="translate(279 58) rotate(45)">
    <use href="#observation-eye" />
</g>

        <!-- Exact 45-degree angle arc -->
        <path
            class="line"
            d="
                M 167 222
                A 52 52 0 0 0
                151.770 185.230
            "
        />

        <text
            class="label"
            x="174"
            y="196"
        >
            45°
        </text>

        <text
            class="star-label"
            x="225"
            y="181"
        >
            ★
        </text>
    </g>

    <!-- ===================================================== -->
    <!-- 75-DEGREE DIAGRAM — RIGHT                             -->
    <!-- ===================================================== -->

    <g transform="translate(410 10)">

        <!-- Table -->
        <line
            class="line"
            x1="20"
            y1="245"
            x2="350"
            y2="245"
        />

        <!-- Device -->
        <rect
            class="line"
            x="45"
            y="222"
            width="230"
            height="23"
            rx="5"
        />

        <!-- Device controls -->
        <rect
            class="line"
            x="72"
            y="230.5"
            width="14"
            height="6"
        />

        <rect
            class="line"
            x="94"
            y="230.5"
            width="14"
            height="6"
        />

        <!-- Bottom-edge reference -->
        <line
            class="line dashed"
            x1="275"
            y1="222"
            x2="275"
            y2="145"
        />

        <line
            class="line"
            x1="275"
            y1="234"
            x2="300"
            y2="216"
        />

        <text
            class="edge-label"
            x="306"
            y="220"
        >
            BOTTOM
        </text>

        <!--
            Exact 75-degree sightline.

            Origin: 115, 222
            Tube begins: 137.04, 139.75
        -->
        <line
    class="line dashed"
    x1="115"
    y1="222"
    x2="133.68"
    y2="152.31"
/>

        <!-- Viewing tube aligned exactly to 75 degrees -->
       <g transform="translate(137.04 147.75) rotate(-75)">
            <rect
                class="line"
                x="0"
                y="-9"
                width="52"
                height="18"
            />
        </g>

        <!--
            Eye center: 154.12, 76
            Exactly the same vertical height as the 45-degree eye.
        -->
        <g transform="translate(160.4 58) rotate(15)">
    <use href="#observation-eye" />
</g>

        <!-- Exact 75-degree angle arc -->
        <path
            class="line"
            d="
                M 167 222
                A 52 52 0 0 0
                128.459 171.772
            "
        />

        <text
            class="label"
            x="174"
            y="193"
        >
            75°
        </text>
    </g>
</svg>