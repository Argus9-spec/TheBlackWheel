<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Black Wheel">

<title>Black Wheel Instrument</title>

<style>

html,body{

    margin:0;
    overflow:hidden;
    background:black;

    color:white;

    display:flex;

    justify-content:center;
    align-items:center;

    height:100%;

    font-family:Helvetica,Arial,sans-serif;

    width: 100%;
    height: 100%;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;

}

#controls {
    position: fixed;
    z-index: 30;
    
    left: 24px;
    bottom: 24px;
    width: 280px;
    padding: 16px;
    box-sizing: border-box;

    color: white;
    background: rgba(0, 0, 0, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;

    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;

    transition: opacity 0.25s ease;
}

#controls.hidden {
    opacity: 0;
    pointer-events: none;
}

#controls label {
    display: block;
    margin-bottom: 12px;
}

#speedSlider {
    width: 100%;
}

#speedReadout {
    margin-top: 8px;
    text-align: center;
    font-variant-numeric: tabular-nums;
}

.controlHint {
    margin-top: 8px;
    text-align: center;
    font-size: 9px;
    opacity: 0.55;
}
:fullscreen {
    background: black;
}

:fullscreen body {
    background: black;
}

#centerStarButton,
#phantomAxisButton {
    width: 100%;

    margin-top: 10px;

    padding: 8px;

    background: white;

    color: black;

    border: 1px solid #999;

    border-radius: 4px;

    cursor: pointer;

    font-weight: bold;

    transition: all 0.15s ease;
}

#centerStarButton.active {
    background: #ff3b30;
    color: white;
    border-color: #ff8a84;
}

#phantomAxisButton.active {
    background: black;
    color: white;
    border-color: white;
}

#skyButtons {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}

#skyButtons button {
    flex: 1;
    padding: 6px;

    background: white;
    color: black;

    border: 1px solid #999;
    border-radius: 4px;

    cursor: pointer;
    font-weight: bold;
}

canvas {

    width: 100vw;

    height: 100vh;

    touch-action: none;

}

#phantomMask {
    position: fixed;
    inset: 0;

    display: none;
    z-index: 10;

    pointer-events: auto;

    --aperture-size: 860px;
    --aperture-top: 120px;
    --aperture-left:
        calc(50% - var(--aperture-size) / 2);
}

#phantomMask.active {
    display: block;
}

#phantomControls {
    position: absolute;
    z-index: 20;

    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    width: min(520px, calc(100% - 40px));

    pointer-events: auto;
    
    opacity: 0;
    visibility: hidden;

    transition:
    opacity 0.6s ease,
    visibility 0.6s ease;

}

#phantomControls button {
    flex: 1;

    min-height: 42px;
    padding: 10px 12px;

    background: black;
    color: white;

    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 5px;

    font-weight: bold;
    letter-spacing: 1px;

    cursor: pointer;
}

#phantomControls.visible {
    opacity: 1;
    visibility: visible;
}

#phantomGuidance {
    position: absolute;
    z-index: 20;

    left: 50%;
    bottom: 110px;
    transform: translateX(-50%);

    color: white;
    text-align: center;

    pointer-events: none;
}

#phantomArrow {
    opacity: 0;

    font-size: 52px;
    line-height: 1;

    transform: translateY(8px);
}

#phantomEye {
    position: relative;

    width: 74px;
    height: 44px;

    margin: 10px auto 0;

    opacity: 0;

    border: 3px solid white;
    border-radius: 50% / 62%;

    box-sizing: border-box;
}

#phantomEye::before {
    content: "";

    position: absolute;
    left: 50%;
    top: 50%;

    width: 23px;
    height: 23px;

    transform: translate(-50%, -50%);

    border: 3px solid white;
    border-radius: 50%;

    box-sizing: border-box;
}

#phantomEye::after {
    content: "";

    position: absolute;
    left: 50%;
    top: 50%;

    width: 9px;
    height: 9px;

    transform: translate(-50%, -50%);

    background: white;
    border-radius: 50%;
}

#phantomGuidance.play #phantomEye {
    animation:
        phantomEyeSequence
        4.2s
        ease
        forwards;
}

#phantomGuidance.play #phantomArrow {
    animation:
        phantomArrowSequence
        4.2s
        ease
        forwards;
}

@keyframes phantomEyeSequence {
    0% {
        opacity: 0;
        transform: scale(0.92);
    }

    15% {
        opacity: 1;
        transform: scale(1);
    }

    82% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(0.98);
    }
}

@keyframes phantomArrowSequence {
    0%,
    20% {
        opacity: 0;
        transform: translateY(8px);
    }

    34% {
        opacity: 1;
        transform: translateY(0);
    }

    68% {
        opacity: 1;
        transform: translateY(0);
    }

    82% {
        opacity: 0;
        transform: translateY(-5px);
    }

    100% {
        opacity: 0;
        transform: translateY(-5px);
    }
}

.maskPanel {
    position: absolute;
    background: black;
}

.maskTop {
    top: 0;
    left: 0;
    right: 0;
    height: var(--aperture-top);
}

.maskLeft {
    top: var(--aperture-top);
    left: 0;
    width: var(--aperture-left);
    height: var(--aperture-size);
}

.maskRight {
    top: var(--aperture-top);
    right: 0;
    width: var(--aperture-left);
    height: var(--aperture-size);
}

.maskBottom {
    left: 0;
    right: 0;
    top:
        calc(
            var(--aperture-top) +
            var(--aperture-size)
        );
    bottom: 0;
}

#phantomAperture {
    position: absolute;
    z-index: 15;

    left: 50%;
    top: var(--aperture-top);

    width: var(--aperture-size);
    height: var(--aperture-size);

    transform: translateX(-50%);

    border-radius: 50%;

    box-shadow:
        0 0 0 200vmax black;

    pointer-events: none;

    display: none;
}

#phantomMask.mask-off #phantomAperture {
    box-shadow: none;
}

#phantomAperture {
    display: block;
}

#phantomMask .maskPanel {
    display: none;
}

#closeControlsButton {

    position: absolute;

    top: 6px;

    right: 8px;

    width: 30px;

    height: 30px;

    padding: 0;

    color: white;

    background: transparent;

    border: none;

    font-size: 24px;

    line-height: 30px;

    cursor: pointer;

}

#controls label:not(:first-child) {
    border-top: 1px solid rgba(255,255,255,.18);
    padding-top: 14px;
    margin-top: 14px;
}

@media (max-width: 700px) {

    #controls {

        left: 12px;

        bottom: 14px;

        width: 292px;

        max-height: none;

        overflow-y: visible;

        padding: 14px;

        font-size: 14px;

        letter-spacing: 0.8px;

        transform: scale(0.88);

        transform-origin: bottom left;

    }

    #phantomMask {

        --aperture-size: 90vw;

        --aperture-top: 14vh;

    }

    #controls label {

        margin-bottom: 4px;

        font-size: 12px;

    }
   #controls input[type="range"] {
    width: 100%;
    height: 26px;
}

   #controls input[type="range"]::-webkit-slider-thumb {
    width: 22px;
    height: 22px;
}

   #skyButtons button,
#centerStarButton {
    min-height: 36px;
    font-size: 13px;
}

   #speedReadout,
   #sizeReadout,
   #dotReadout,
   #densityReadout,
   #magnitudeReadout {
       font-size: 12px;
       line-height: 1.2;
    }
}

</style>

<script>
window.addEventListener("error", function (event) {

    const isGenericSafariError =
        event.message === "Script error." &&
        event.lineno === 0 &&
        event.colno === 0;

if (isGenericSafariError) {

BLACK WHEEL ERROR

${event.message}

File:
${event.filename}

Line:
${event.lineno}

Column:
${event.colno}

    `;
});

window.addEventListener("unhandledrejection", function (event) {

${event.reason}
        </pre>
    `;
});
</script>

<script type="module">
import { blackWheelV1 } from "./data/blackWheelV1.js?v=3";
import { skyII } from "./data/skyII.js";
import { skyIII } from "./data/skyIII.js";
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let viewWidth = window.innerWidth;
let viewHeight = window.innerHeight;
function resize() {
    viewWidth = window.innerWidth;
    viewHeight = window.innerHeight;

    const pixelRatio =
        Math.min(window.devicePixelRatio || 1, 2);

    canvas.style.width = `${viewWidth}px`;
    canvas.style.height = `${viewHeight}px`;

    canvas.width =
        Math.round(viewWidth * pixelRatio);

    canvas.height =
        Math.round(viewHeight * pixelRatio);

    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}

window.addEventListener("resize", resize);
resize();

canvas.style.touchAction = "none";
canvas.style.cursor = "grab";

canvas.addEventListener("pointerdown", function (event) {
    isDragging = true;

    dragStartX = event.clientX;
    dragStartY = event.clientY;

    offsetStartX = wheelOffsetX;
    offsetStartY = wheelOffsetY;

    canvas.setPointerCapture(event.pointerId);
    canvas.style.cursor = "grabbing";
});

canvas.addEventListener("pointermove", function (event) {
    if (!isDragging || isPinching) return;

    wheelOffsetX =
        offsetStartX + (event.clientX - dragStartX);

    wheelOffsetY =
        offsetStartY + (event.clientY - dragStartY);
});

canvas.addEventListener("pointerup", function (event) {
    isDragging = false;

    if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
    }

    canvas.style.cursor = "grab";
});

canvas.addEventListener("pointercancel", function (event) {
    isDragging = false;

    if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
    }

    canvas.style.cursor = "grab";
});

canvas.addEventListener(
    "wheel",
    function (event) {
        event.preventDefault();

        const zoomDirection = event.deltaY < 0 ? 1 : -1;
        const zoomStep = 0.04;

        wheelScale += zoomDirection * zoomStep;

       wheelScale = Math.max(0.20, Math.min(1.10, wheelScale));

        sizeSlider.value = wheelScale.toFixed(2);
        sizeReadout.textContent =
            `${Math.round(wheelScale * 100)}%`;
    },
    { passive: false }
);

function getTouchDistance(touchA, touchB) {
    const dx = touchB.clientX - touchA.clientX;
    const dy = touchB.clientY - touchA.clientY;

    return Math.hypot(dx, dy);
}

canvas.addEventListener(
    "touchstart",
    function (event) {
        if (event.touches.length !== 2) return;

        event.preventDefault();

isPinching = true;
isDragging = false;
suppressTapUntil = Date.now() + 700;

pinchStartDistance =

            getTouchDistance(
                event.touches[0],
                event.touches[1]
            );

        pinchStartScale = wheelScale;
    },
    { passive: false }
);

canvas.addEventListener(
    "touchmove",
    function (event) {
        if (
            !isPinching ||
            event.touches.length !== 2
        ) {
            return;
        }

        event.preventDefault();

        suppressTapUntil = Date.now() + 700;

        const currentDistance =
            getTouchDistance(
                event.touches[0],
                event.touches[1]
            );

        const pinchRatio =
            currentDistance / pinchStartDistance;

        wheelScale =
            pinchStartScale * pinchRatio;

        wheelScale =
            Math.max(
                0.20,
                Math.min(1.10, wheelScale)
            );

        sizeSlider.value =
            wheelScale.toFixed(2);

        sizeReadout.textContent =
            `${Math.round(wheelScale * 100)}%`;
    },
    { passive: false }
);

canvas.addEventListener(
    "touchend",
    function (event) {
        if (
            isPinching &&
            event.touches.length < 2
        ) {
            isPinching = false;
            suppressTapUntil = Date.now() + 700;
        }
    },
    { passive: false }
);

canvas.addEventListener(
    "touchcancel",
    function () {
        isPinching = false;
    },
    { passive: false }
);

const skies = {
    1: blackWheelV1,
    2: skyII,
    3: skyIII
};

let currentSky = skies[1];
let stars = currentSky.stars;

function findCenterStarIndex(starList) {
    return starList.reduce(
        (closestIndex, star, index) => {
            const distance =
                Math.hypot(star.x, star.y);

            const closestStar =
                starList[closestIndex];

            const closestDistance =
                Math.hypot(
                    closestStar.x,
                    closestStar.y
                );

            return distance < closestDistance
                ? index
                : closestIndex;
        },
        0
    );
}

let centerStarIndex =
    findCenterStarIndex(stars);

function deterministicValue(seed) {
    const value = Math.sin(seed * 12.9898) * 43758.5453;
    return value - Math.floor(value);
}

function buildDensityStars(level) {
    if (level === 1) {
        return [...stars];
    }

    const expandedStars = [...stars];
    const targetCount = stars.length * level;

    const minimumSpacing = 0.020;
    const minimumSpacingSquared =
        minimumSpacing * minimumSpacing;

    // The field expands slightly as density increases.
    const maximumRadius =
        0.985 + (level - 1) * 0.018;

    function canPlaceStar(x, y) {
        for (const existingStar of expandedStars) {
            const dx = x - existingStar.x;
            const dy = y - existingStar.y;

            if (
                dx * dx + dy * dy <
                minimumSpacingSquared
            ) {
                return false;
            }
        }

        return true;
    }

    function addInheritedStar(x, y) {
        const inheritedStar =
            stars[
                expandedStars.length %
                stars.length
            ];

        expandedStars.push({
            ...inheritedStar,
            x,
            y
        });
    }

    let attempt = 0;
    const maximumAttempts = targetCount * 1200;

    while (
        expandedStars.length < targetCount &&
        attempt < maximumAttempts
    ) {
        const seed =
            level * 2000000 +
            attempt * 2;

        const angle =
            deterministicValue(seed + 1) *
            Math.PI *
            2;

        const radius =
            Math.sqrt(
                deterministicValue(seed + 2)
            ) *
            maximumRadius;

        const candidateX =
            Math.cos(angle) * radius;

        const candidateY =
            Math.sin(angle) * radius;

        if (canPlaceStar(candidateX, candidateY)) {
            addInheritedStar(
                candidateX,
                candidateY
            );
        }

        attempt++;
    }

    return expandedStars;
}

let renderedStars;

let rotation = 0;
let rotationSpeed = 0.0015;
let wheelScale = 0.46;
let dotSize = 0.5;
let densityLevel = 4;
let magnitudeVariation = 1;
let showCenterStar = false;

renderedStars = buildDensityStars(densityLevel);

let wheelOffsetX = 0;

let wheelOffsetY =
    window.innerWidth <= 700
        ? -70
        : 0;

let hPressTimer = null;
const doubleHDelay = 300;

let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let offsetStartX = 0;
let offsetStartY = 0;

let isPinching = false;
let pinchStartDistance = 0;
let pinchStartScale = wheelScale;
let suppressTapUntil = 0;

const speedSlider = document.getElementById("speedSlider");
const speedReadout = document.getElementById("speedReadout");
const sizeSlider = document.getElementById("sizeSlider");
const sizeReadout = document.getElementById("sizeReadout");
const dotSlider = document.getElementById("dotSlider");
const dotReadout = document.getElementById("dotReadout");

const densitySlider =
    document.getElementById("densitySlider");

const densityReadout =
    document.getElementById("densityReadout");

    densityReadout.textContent =
    `${currentSky.name.toUpperCase()} · ${renderedStars.length} STARS`;  

const magnitudeSlider =
    document.getElementById("magnitudeSlider");

const magnitudeReadout =
    document.getElementById("magnitudeReadout"); 
    
const centerStarButton =
    document.getElementById("centerStarButton");

const phantomMask =
    document.getElementById("phantomMask");

const phantomGuidance =
    document.getElementById("phantomGuidance");

const phantomControls =
    document.getElementById("phantomControls");

const maskVisibilityButton =
    document.getElementById("maskVisibilityButton");

const phantomReturnButton =
    document.getElementById("phantomReturnButton");

let phantomControlsTimer = null;
let phantomMaskVisible = true;

centerStarButton.classList.toggle(
    "active",
    showCenterStar
);

const skyButtons =
    document.querySelectorAll(
        "#skyButtons button"
    );




function updateSpeedDisplay() {
    const magnitude = Math.abs(rotationSpeed).toFixed(4);

    if (rotationSpeed > 0) {
        speedReadout.textContent = `FORWARD  ${magnitude}`;
    } else if (rotationSpeed < 0) {
        speedReadout.textContent = `REVERSE  ${magnitude}`;
    } else {
        speedReadout.textContent = "STOPPED";
    }
}

// Synchronize controls with canonical startup state
magnitudeVariation
speedSlider.value = rotationSpeed;
sizeSlider.value = wheelScale;
dotSlider.value = dotSize;
densitySlider.value = densityLevel;
magnitudeSlider.value = magnitudeVariation;

updateSpeedDisplay();

sizeReadout.textContent =
    `${Math.round(wheelScale * 100)}%`;

dotReadout.textContent =
    `${dotSize.toFixed(1)} px`;

magnitudeReadout.textContent =
    `${Math.round(magnitudeVariation * 100)}%`;

speedSlider.addEventListener("input", function () {
    rotationSpeed = Number(speedSlider.value);
    updateSpeedDisplay();
});

sizeSlider.addEventListener("input", function () {
    wheelScale = Number(sizeSlider.value);
    sizeReadout.textContent =
        `${Math.round(wheelScale * 100)}%`;
});

dotSlider.addEventListener("input", function () {
    dotSize = Number(dotSlider.value);
    dotReadout.textContent = `${dotSize.toFixed(1)} px`;
});

densitySlider.addEventListener("input", function () {
    densityLevel = Number(densitySlider.value);
    renderedStars = buildDensityStars(densityLevel);

    const starCount = renderedStars.length;

    if (densityLevel === 1) {
        densityReadout.textContent =
            `ORIGINAL · ${starCount} STARS`;
    } else {
        densityReadout.textContent =
            `${densityLevel}× · ${starCount} STARS`;
    }
});

magnitudeSlider.addEventListener("input", function () {
    magnitudeVariation =
        Number(magnitudeSlider.value);

    magnitudeReadout.textContent =
        `${Math.round(magnitudeVariation * 100)}%`;
});

skyButtons.forEach(function (button) {
    button.addEventListener("click", function () {
        const skyNumber =
            Number(button.dataset.sky);

        currentSky = skies[skyNumber];
        stars = currentSky.stars;

        centerStarIndex =
            findCenterStarIndex(stars);

        renderedStars =
            buildDensityStars(densityLevel);

        densityReadout.textContent =
            `${currentSky.name.toUpperCase()} · ` +
            `${renderedStars.length} STARS`;

        skyButtons.forEach(function (otherButton) {
            otherButton.classList.remove("active");
        });

        button.classList.add("active");
    });
});

centerStarButton.addEventListener("click", function () {
    showCenterStar = !showCenterStar;

    centerStarButton.classList.toggle(
        "active",
        showCenterStar
    );
});

phantomAxisButton.addEventListener(
    "click",
    function () {

        if (!phantomAxisMode) {

            // Save exact observation state
            const currentSkyNumber =
                Number(
                    [...skyButtons]
                        .find(
                            button =>
                                button.classList.contains("active")
                        )
                        ?.dataset.sky || 1
                );

            savedObservationState = {
                wheelScale,
                wheelOffsetX,
                wheelOffsetY,
                rotationSpeed,
                dotSize,
                densityLevel,
                magnitudeVariation,
                showCenterStar,
                skyNumber: currentSkyNumber
            };

            phantomAxisMode = true;

            const phantomViewportHeight =
                  window.visualViewport
                ? window.visualViewport.height
                : viewHeight;

            const viewportWidth =
                  window.visualViewport
                ? window.visualViewport.width
                : window.innerWidth;

            const isPhone =
                  viewportWidth <= 700;

            const isTablet =
                  viewportWidth > 700 &&
                  viewportWidth <= 1200;

        wheelScale =
    isPhone
        ? 0.94
        : isTablet
            ? 1.08
            : 1.45;

wheelOffsetX = 0;

wheelOffsetY =
    isPhone
        ? phantomViewportHeight * 0.17
        : isTablet
            ? phantomViewportHeight * 0.38
            : phantomViewportHeight * 0.64;

rotationSpeed = 0.0007;

speedSlider.value = rotationSpeed;
updateSpeedDisplay();

dotSize = 0.3;

dotSlider.value = dotSize;

dotReadout.textContent =
    `${dotSize.toFixed(1)} px`;

            phantomAxisButton.classList.add("active");

            phantomMask.classList.add("active");
            phantomMaskVisible = true;
            phantomMask.classList.remove("mask-off");

            maskVisibilityButton.textContent =
                "MASK OFF";

            playPhantomGuidance();

            setTimeout(function () {
                if (phantomAxisMode) {
                    showPhantomControls();
                }
            }, 4400);

            controls.classList.add("hidden");

        } else {

            if (savedObservationState) {

                wheelScale =
                    savedObservationState.wheelScale;

                wheelOffsetX =
                    savedObservationState.wheelOffsetX;

                wheelOffsetY =
                    savedObservationState.wheelOffsetY;

                rotationSpeed =
                    savedObservationState.rotationSpeed;

                dotSize =
                    savedObservationState.dotSize;

                densityLevel =
                    savedObservationState.densityLevel;

                magnitudeVariation =
                    savedObservationState.magnitudeVariation;

                showCenterStar =
                    savedObservationState.showCenterStar;

                currentSky =
                    skies[savedObservationState.skyNumber];

                stars = currentSky.stars;

                centerStarIndex =
                    findCenterStarIndex(stars);

                renderedStars =
                    buildDensityStars(densityLevel);

                // Restore controls and readouts
                speedSlider.value = rotationSpeed;
                sizeSlider.value = wheelScale;
                dotSlider.value = dotSize;
                densitySlider.value = densityLevel;
                magnitudeSlider.value =
                    magnitudeVariation;

                updateSpeedDisplay();

                sizeReadout.textContent =
                    `${Math.round(wheelScale * 100)}%`;

                dotReadout.textContent =
                    `${dotSize.toFixed(1)} px`;

                densityReadout.textContent =
                    `${currentSky.name.toUpperCase()} · ` +
                    `${renderedStars.length} STARS`;

                magnitudeReadout.textContent =
                    `${Math.round(
                        magnitudeVariation * 100
                    )}%`;

                centerStarButton.classList.toggle(
                    "active",
                    showCenterStar
                );

                skyButtons.forEach(function (button) {
                    button.classList.toggle(
                        "active",
                        Number(button.dataset.sky) ===
                            savedObservationState.skyNumber
                    );
                });
            }

            phantomAxisMode = false;
            savedObservationState = null;

            phantomAxisButton.classList.remove("active");
            phantomMask.classList.remove("active");
            hidePhantomControls();

            phantomMaskVisible = true;
            phantomMask.classList.remove("mask-off");

            maskVisibilityButton.textContent =
                "MASK OFF";
            controls.classList.remove("hidden");


        }
    }
);

updateSpeedDisplay();

sizeSlider.addEventListener("input", function () {
    wheelScale = Number(sizeSlider.value);
    sizeReadout.textContent =
        `${Math.round(wheelScale * 100)}%`;
});

const controls = document.getElementById("controls");

const closeControlsButton =
    document.getElementById("closeControlsButton");

closeControlsButton.addEventListener(
    "click",
    function () {
        controls.classList.add("hidden");
    }
);

let phantomAxisMode = false;

let savedObservationState = null;

let lastCanvasTapTime = 0;

canvas.addEventListener("pointerup", function (event) {
    if (event.pointerType !== "touch") return;

   if (
    isPinching ||
    Date.now() < suppressTapUntil
) {
    lastCanvasTapTime = 0;
    return;
}

    const now = Date.now();
    const timeSinceLastTap =
        now - lastCanvasTapTime;

    if (timeSinceLastTap < 350) {
        controls.classList.toggle("hidden");
        lastCanvasTapTime = 0;
    } else {
        lastCanvasTapTime = now;
    }
});

document.addEventListener("keydown", function (event) {
    const key = event.key.toLowerCase();

    if (key === "h") {
        if (event.repeat) return;

        if (hPressTimer !== null) {
            clearTimeout(hPressTimer);
            hPressTimer = null;

           if (!document.fullscreenElement) {
               controls.classList.add("hidden");
               document.documentElement.requestFullscreen();
           } else {
               document.exitFullscreen();
           }

            return;
        }

        hPressTimer = setTimeout(function () {
            controls.classList.toggle("hidden");
            hPressTimer = null;
        }, doubleHDelay);
    }

    if (key === "r") {
        wheelOffsetX = 0;
        wheelOffsetY = 0;
    }
});

let lastFrameTime = null;

function playPhantomGuidance() {
    phantomGuidance.classList.remove("play");

    // Forces the animation to restart on every entry.
    void phantomGuidance.offsetWidth;

    phantomGuidance.classList.add("play");

    setTimeout(function () {
        phantomGuidance.classList.remove("play");
    }, 4300);
}

function showPhantomControls() {
    phantomControls.classList.add("visible");

    clearTimeout(phantomControlsTimer);

    phantomControlsTimer =
        setTimeout(function () {
            phantomControls.classList.remove("visible");
        }, 4000);
}

function hidePhantomControls() {
    clearTimeout(phantomControlsTimer);
    phantomControls.classList.remove("visible");
}

phantomMask.addEventListener(
    "click",
    function () {
        if (!phantomAxisMode) {
            return;
        }

        showPhantomControls();
    }
);

phantomControls.addEventListener(
    "click",
    function (event) {
        event.stopPropagation();
    }
);

maskVisibilityButton.addEventListener(
    "click",
    function () {
        phantomMaskVisible =
            !phantomMaskVisible;

        phantomMask.classList.toggle(
            "mask-off",
            !phantomMaskVisible
        );

        maskVisibilityButton.textContent =
            phantomMaskVisible
                ? "MASK OFF"
                : "MASK ON";

        showPhantomControls();
    }
);

phantomReturnButton.addEventListener(
    "click",
    function () {
        phantomAxisButton.click();
    }
);

function draw(timestamp) {
    if (lastFrameTime === null) {
        lastFrameTime = timestamp;
    }

    const deltaTime = Math.min(timestamp - lastFrameTime, 100);
    lastFrameTime = timestamp;

    const apparentSpeedScale =
    phantomAxisMode
        ? 0.94 / wheelScale
        : 1;

rotation +=
    rotationSpeed *
    apparentSpeedScale *
    (deltaTime / 16.6667);

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, viewWidth, viewHeight);

    const viewport = window.visualViewport;

const cx =
    (viewport
        ? viewport.offsetLeft + viewport.width / 2
        : viewWidth / 2) +
    wheelOffsetX;

const cy =
    (viewport
        ? viewport.offsetTop + viewport.height / 2
        : viewHeight / 2) +
    wheelOffsetY;

    const wheelRadius =
        Math.min(viewWidth, viewHeight) * wheelScale;

    const cosR = Math.cos(rotation);
    const sinR = Math.sin(rotation);

    for (
        let starIndex = 0;
        starIndex < renderedStars.length;
        starIndex++
    ) {
        if (starIndex === centerStarIndex) {
            continue;
        }

        const star = renderedStars[starIndex];

        const rotatedX =
            star.x * cosR -
            star.y * sinR;

        const rotatedY =
            star.x * sinR +
            star.y * cosR;

        const x = cx + rotatedX * wheelRadius;
        const y = cy + rotatedY * wheelRadius;

        const baseScaledDotSize =
            dotSize * (wheelScale / 0.46);

        const magnitudeSeed =
            deterministicValue(
                starIndex * 7919 + 104729
            );

        const magnitudeRank =
            Math.pow(magnitudeSeed, 4);

        const maximumExtraScale = 2;

        const magnitudeMultiplier =
            1 +
            magnitudeVariation *
            magnitudeRank *
            maximumExtraScale;

        const scaledDotSize =
            baseScaledDotSize *
            magnitudeMultiplier;

        ctx.fillStyle = "white";
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(
            x,
            y,
            scaledDotSize,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    // Draw constant-size center measurement star
    // at its true imported wheel position.
    const centerStarSize =
    1.03 * (wheelScale / 0.46);
    const centerStar =
        renderedStars[centerStarIndex];

    const centerRotatedX =
        centerStar.x * cosR -
        centerStar.y * sinR;

    const centerRotatedY =
        centerStar.x * sinR +
        centerStar.y * cosR;

    const centerStarX =
        cx + centerRotatedX * wheelRadius;

    const centerStarY =
        cy + centerRotatedY * wheelRadius;

    ctx.fillStyle =
        showCenterStar
            ? "#ff3b30"
            : "white";

    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(
        centerStarX,
        centerStarY,
        centerStarSize,
        0,
        Math.PI * 2
    );
    ctx.fill();

    requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

</script>
